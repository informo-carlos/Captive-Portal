worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  # Logs
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # ─────────────────────────────────────────────
  # Admin frontend — porta 8080
  # ─────────────────────────────────────────────
  server {
    listen 8080;
    server_name _;

    location / {
      proxy_pass http://admin-frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ─────────────────────────────────────────────
  # Admin backend — porta 8000
  # ─────────────────────────────────────────────
  server {
    listen 8000;
    server_name _;

    location / {
      proxy_pass http://admin-backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
  }

  # ─────────────────────────────────────────────
  # Tenants — uma entrada por cliente
  # Duplicar o bloco abaixo para cada novo tenant
  # ─────────────────────────────────────────────

  # Cliente exemplo — porta 29000
  # API (backend) e frontend (Next.js) na mesma porta
  server {
    listen 29000;
    server_name _;

    # Rotas da API vao para o backend do tenant
    location /auth/ {
      proxy_pass http://portal-cliente-exemplo:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 15s;
    }

    location /health {
      proxy_pass http://portal-cliente-exemplo:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Tudo o resto vai para o frontend compartilhado
    location / {
      proxy_pass http://portal-frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # Cliente dois — porta 29001 (descomentar ao criar o tenant)
  # server {
