services:

  # ─────────────────────────────────────────
  # Infraestrutura base
  # ─────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: captive_portal
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d captive_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8000:8000"
      # Portas dos tenants (adicionar conforme novos clientes)
      - "29000:29000"
      - "29001:29001"
      - "29002:29002"
      # Adicionar mais portas aqui ao criar novos tenants
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - admin-backend
      - admin-frontend
      - portal-frontend
    networks:
      - internal
      - external

  # ─────────────────────────────────────────
  # Admin
  # ─────────────────────────────────────────

  admin-backend:
    build:
      context: ../apps/admin-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/captive_portal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin-frontend:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${ADMIN_API_URL}
      NODE_ENV: production
    depends_on:
      - admin-backend
    networks:
      - internal

  portal-frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      NODE_ENV: production
    networks:
      - internal

  # ─────────────────────────────────────────
  # Tenants (portal captivo por cliente)
  # Duplicar este bloco para cada novo cliente
  # Alterar: nome do serviço, porta e variáveis
  # ─────────────────────────────────────────

  portal-cliente-exemplo:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      TENANT_ID: ${TENANT_EXEMPLO_ID}
      ALLOWED_SERIALS: ${TENANT_EXEMPLO_SERIALS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/captive_portal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ZENVIA_TOKEN: ${TENANT_EXEMPLO_ZENVIA_TOKEN}
      SONICWALL_HOST: ${TENANT_EXEMPLO_SW_HOST}
      SONICWALL_USER: ${TENANT_EXEMPLO_SW_USER}
      SONICWALL_PASS: ${TENANT_EXEMPLO_SW_PASS}
      SONICWALL_FIRMWARE: ${TENANT_EXEMPLO_SW_FIRMWARE}
      SONICWALL_MODE: ${TENANT_EXEMPLO_SW_MODE:-rest}
      SONICWALL_LHM_PORT: ${TENANT_EXEMPLO_SW_LHM_PORT:-4043}
      SONICWALL_GUEST_SERVICE_USER: ${TENANT_EXEMPLO_SW_GUEST_SERVICE_USER:-}
      SONICWALL_GUEST_SERVICE_PASS: ${TENANT_EXEMPLO_SW_GUEST_SERVICE_PASS:-}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    labels:
      - "captive.tenant=true"
      - "captive.port=29000"

