services:

  # ─────────────────────────────────────────
  # Infraestrutura base
  # ─────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: captive_portal
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations são executadas via node-pg-migrate (npm run migrate),
      # NÃO via docker-entrypoint-initdb.d — evita conflito de execução dupla.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d captive_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8000:8000"
      # Range de portas dos tenants — provisioner aloca dinamicamente
      - "29000-29099:29000-29099"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_tenants_conf:/etc/nginx/conf.d/tenants
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - admin-backend
      - admin-frontend
      - portal-frontend
    networks:
      - internal
      - external

  # ─────────────────────────────────────────
  # Admin
  # ─────────────────────────────────────────

  admin-backend:
    build:
      context: ../apps/admin-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/captive_portal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
      # ─── VPN IPsec (strongSwan + swan-api sidecar) ───
      SWAN_API_URL: http://strongswan:9999
      SWAN_API_KEY: ${SWAN_API_KEY}
      SWAN_VPS_PUBLIC_IP: ${SWAN_VPS_PUBLIC_IP:-45.7.53.80}
      SWAN_IKE_PROPOSALS: ${SWAN_IKE_PROPOSALS:-aes256-sha256-modp2048,aes128-sha256-modp2048,default}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin-frontend:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${ADMIN_API_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${ADMIN_API_URL}
      NODE_ENV: production
    depends_on:
      - admin-backend
    networks:
      - internal

  portal-frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      NODE_ENV: production
    networks:
      - internal

  # ─────────────────────────────────────────
  # Tenants (portal captivo por cliente)
  # Duplicar este bloco para cada novo cliente
  # Alterar: nome do serviço, porta e variáveis
  # ─────────────────────────────────────────

  portal-cliente-exemplo:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      TENANT_ID: ${TENANT_EXEMPLO_ID}
      ALLOWED_SERIALS: ${TENANT_EXEMPLO_SERIALS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/captive_portal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ZENVIA_TOKEN: ${TENANT_EXEMPLO_ZENVIA_TOKEN}
      ZENVIA_SENDER: ${TENANT_EXEMPLO_ZENVIA_SENDER}
      SONICWALL_HOST: ${TENANT_EXEMPLO_SW_HOST}
      SONICWALL_PORT: ${TENANT_EXEMPLO_SW_PORT:-443}
      SONICWALL_USER: ${TENANT_EXEMPLO_SW_USER}
      SONICWALL_PASS: ${TENANT_EXEMPLO_SW_PASS}
      SONICWALL_FIRMWARE: ${TENANT_EXEMPLO_SW_FIRMWARE}
      SONICWALL_MODE: ${TENANT_EXEMPLO_SW_MODE:-rest}
      SONICWALL_LHM_PORT: ${TENANT_EXEMPLO_SW_LHM_PORT:-4043}
      SONICWALL_GUEST_SERVICE_USER: ${TENANT_EXEMPLO_SW_GUEST_SERVICE_USER:-}
      SONICWALL_GUEST_SERVICE_PASS: ${TENANT_EXEMPLO_SW_GUEST_SERVICE_PASS:-}
      # VPN — URL base do mgmt via WireGuard (ex: https://198.18.0.5:4443/).
      # Deixar em branco (default) = sem VPN, usa lhmPost legacy pro frontend.
      # NOTA DE INFRA: quando definida, o container precisa estar na rede
      # `external` (172.19.0.0/16) E ter rota 198.18.0.0/15 via 172.19.0.20
      # (container infra-wireguard). Ver docs/wireguard-vpn-architecture.md 4.4.
      LHM_MGMT_LAN_URL: ${TENANT_EXEMPLO_LHM_MGMT_LAN_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      # Adicionar `external` abaixo quando TENANT_EXEMPLO_LHM_MGMT_LAN_URL
      # estiver definida, para que o container alcance o infra-wireguard
      # (172.19.0.20) e faça rota pra 198.18.0.0/15.
      # - external
    labels:
      - "captive.tenant=true"
      - "captive.port=29000"

  # portal-cliente-dois:
  #   build: { context: ../apps/backend, dockerfile: Dockerfile }
  #   restart: unless-stopped
  #   environment:
  #     PORT: 3000
  #     TENANT_ID: ${TENANT_DOIS_ID}
  #     ALLOWED_SERIALS: ${TENANT_DOIS_SERIALS}
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/captive_portal
  #     REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  #     ZENVIA_TOKEN: ${TENANT_DOIS_ZENVIA_TOKEN}
  #     SONICWALL_HOST: ${TENANT_DOIS_SW_HOST}
  #     SONICWALL_USER: ${TENANT_DOIS_SW_USER}
  #     SONICWALL_PASS: ${TENANT_DOIS_SW_PASS}
  #     SONICWALL_FIRMWARE: 7
  #     NODE_ENV: production
  #   expose:
  #     - "3000"
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #   networks:
  #     - internal

  # ─────────────────────────────────────────
  # Provisioner — worker que cria containers de tenants sob demanda
  # ─────────────────────────────────────────

  provisioner:
    build:
      context: ../apps/provisioner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/captive_portal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      PORTAL_IMAGE: infra-portal-cliente-exemplo
      INTERNAL_NETWORK: infra_internal
      NGINX_CONF_DIR: /etc/nginx/conf.d/tenants
      NGINX_CONTAINER: infra-nginx-1
      POLL_INTERVAL_MS: "5000"
      HEALTHCHECK_TIMEOUT_SEC: "60"
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx_tenants_conf:/etc/nginx/conf.d/tenants
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ─── strongSwan IPsec concentrator ──────────────────────────────────
  # Túnel IPsec/IKEv2 entre VPS (responder/passive) e SonicWall de cada
  # tenant (initiator). PSK auth.
  # Range do túnel: 198.18.0.0/15 (RFC 2544 — sem overlap com cliente).
  # VPS = 198.18.0.1; cada tenant ocupa um /32.
  # Conexões gerenciadas dinamicamente pelo sidecar swan-api (via swanctl).
  # Spec: docs/ipsec-vpn-architecture.md
  strongswan:
    image: strongx509/strongswan:6.0.0
    container_name: infra-strongswan
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - "500:500/udp"      # IKE
      - "4500:4500/udp"    # NAT-T
    volumes:
      - strongswan_config:/etc/swanctl
    networks:
      # `internal` pra admin-backend chamar o sidecar swan-api (que herda
      # esta rede via network_mode: service:strongswan).
      # `external` pra portal-cliente alcançar este container via
      # 172.19.0.20 e adicionar rota pra 198.18.0.0/15.
      internal:
      external:
        ipv4_address: 172.19.0.20
    # Mantém o daemon rodando — strongx509/strongswan tem entrypoint
    # padrão que sobe ipsec/charon e fica em foreground.

  # ─── Sidecar HTTP que gerencia conexões IPsec via swanctl CLI ─────────
  # Roda no mesmo network namespace que `strongswan`. Cada peer (tenant) é
  # um arquivo .conf em /etc/swanctl/conf.d/ + secrets.
  # Ver apps/swan-api/README.md.
  swan-api:
    build:
      context: ../apps/swan-api
    container_name: infra-swan-api
    restart: unless-stopped
    network_mode: "service:strongswan"
    cap_add:
      - NET_ADMIN  # swanctl precisa pra reconfigurar o daemon
    depends_on:
      - strongswan
    environment:
      - LISTEN_ADDR=:9999
      - SWAN_API_KEY=${SWAN_API_KEY}
    volumes:
      # Compartilha o conf.d com strongswan pra escrever os arquivos
      # de peer e o daemon reler via `swanctl --load-conns`.
      - strongswan_config:/etc/swanctl

volumes:
  postgres_data:
  redis_data:
  certbot_certs:
  nginx_tenants_conf:
  strongswan_config:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
